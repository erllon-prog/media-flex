<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f5132">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Média Flex">
  <title>Média Flex</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="../comum/nucleo.css?v=1">
  <link rel="stylesheet" href="app.css?v=4">
</head>
<body>
  <section id="view-app" hidden>
    <header class="topbar mf-topbar">
      <div class="mf-tit"><img src="icon-192.png" alt=""><span>Média Flex</span></div>
      <span class="mf-ultimo" id="ultimoKm"></span>
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu">⋯<span id="menu-dot" class="menu-dot" hidden></span></button>
    </header>

    <div id="menu" class="menu" hidden>
      <button id="open-amigos">Amigos <span id="amigos-badge" class="badge novo" hidden></span></button>
      <button id="open-users" hidden>Usuários e acessos <span id="novos-badge" class="badge novo" hidden></span></button>
      <button id="abrir-apps">Nossos apps</button>
      <button id="compartilhar-app">Compartilhar o app</button>
      <button id="logout" class="danger">Sair</button>
    </div>

    <main class="content">
      <button type="button" id="novos-aviso" class="convite-aviso" hidden></button>
      <button type="button" id="convite-aviso" class="convite-aviso" hidden></button>

      <!-- NOVO ABASTECIMENTO -->
      <section class="card mf-painel" id="novo" aria-labelledby="t-novo">
        <h2 id="t-novo" class="mf-h2">Novo abastecimento</h2>

        <div class="mf-shots" id="shots">
          <label class="mf-shot" id="tile-painel">
            <input type="file" accept="image/*" capture="environment" id="in-painel" aria-label="Fotografar painel">
            <svg class="mf-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3.5 16a8.5 8.5 0 1 1 17 0"/><path d="M12 16l4-5"/><circle cx="12" cy="16" r="1.3" fill="currentColor"/><path d="M6 12.5l1 .6M18 12.5l-1 .6M12 8.5v1.2"/></svg>
            <b>Painel</b><span>KM atual do hodômetro</span>
          </label>
          <label class="mf-shot" id="tile-nota">
            <input type="file" accept="image/*" capture="environment" id="in-nota" aria-label="Fotografar nota do posto">
            <svg class="mf-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 3h12v18l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4L6 21z"/><path d="M9 8h6M9 11.5h6M9 15h3.5"/></svg>
            <b>Nota</b><span>Litros e valor pago</span>
          </label>
        </div>
        <div class="mf-gal">
          <label class="link">ou escolher foto do painel<input type="file" accept="image/*" id="g-painel"></label>
          <label class="link">ou escolher foto da nota<input type="file" accept="image/*" id="g-nota"></label>
        </div>

        <div class="seg seg-2 mf-comb" role="group" aria-label="Combustível">
          <button type="button" class="eth active" id="b-etanol" aria-pressed="true">Etanol</button>
          <button type="button" class="gas" id="b-gasolina" aria-pressed="false">Gasolina</button>
        </div>

        <div class="mf-fields">
          <label>KM no painel<input id="f-km" inputmode="numeric" autocomplete="off" placeholder="0"></label>
          <label>Litros<input id="f-litros" inputmode="decimal" autocomplete="off" placeholder="0,000"></label>
          <label>Total pago (R$)<input id="f-total" inputmode="decimal" autocomplete="off" placeholder="0,00"></label>
          <label>Preço por litro (R$)<input id="f-preco" inputmode="decimal" autocomplete="off" placeholder="0,00"></label>
          <label>Data<input id="f-data" type="date"></label>
          <label class="check mf-cheio"><input type="checkbox" id="f-cheio" checked> Tanque cheio</label>
        </div>
        <p class="muted small mf-nota">A média sai entre dois abastecimentos com tanque cheio (até o gatilho desarmar).</p>

        <p class="mf-msg" id="formMsg" hidden></p>
        <div class="sheet-foot mf-acoes">
          <button type="button" class="btn" id="cancelar" hidden>Cancelar</button>
          <button type="button" class="btn primary" id="salvar">Salvar abastecimento</button>
        </div>
      </section>

      <!-- PLACAR -->
      <section class="card mf-painel" aria-labelledby="t-placar">
        <div class="mf-head">
          <h2 id="t-placar" class="mf-h2">Etanol x Gasolina</h2>
          <div class="mf-periodo" role="group" aria-label="Período">
            <button type="button" class="chip" data-p="90">3 meses</button>
            <button type="button" class="chip" data-p="180">6 meses</button>
            <button type="button" class="chip active" data-p="0">Tudo</button>
          </div>
        </div>
        <div id="placar"></div>
      </section>

      <!-- HISTÓRICO -->
      <section class="card mf-painel" aria-labelledby="t-hist">
        <div class="mf-head"><h2 id="t-hist" class="mf-h2">Histórico</h2><span class="muted small" id="histCount"></span></div>
        <div class="mf-lista" id="lista"></div>
      </section>
    </main>
  </section>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../comum/config.js?v=1"></script>
  <script src="../comum/nucleo.js?v=1"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
